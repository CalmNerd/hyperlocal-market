openapi: 3.0.3
info:
  title: Hyperlocal Marketplace API
  version: 1.0.0
  description: REST API for the hyperlocal grocery marketplace assignment.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/auth/register:
    post:
      summary: Register customer or vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [CUSTOMER, VENDOR] }
                shopName: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        "201": { description: Created }
        "409": { description: Email already exists }
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK }
        "401": { description: Invalid credentials }
  /api/auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/vendor/shop:
    get:
      summary: Get my shop
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    put:
      summary: Update my shop
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/vendor/products:
    get:
      summary: List my products
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      summary: Create product
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /api/vendor/products/{id}:
    patch:
      summary: Update own product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "404": { description: Not found / not owned }
    delete:
      summary: Soft-delete own product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
  /api/shops/nearby:
    get:
      summary: Nearby approved shops
      parameters:
        - in: query
          name: latitude
          required: true
          schema: { type: number }
        - in: query
          name: longitude
          required: true
          schema: { type: number }
        - in: query
          name: radiusKm
          schema: { type: number, default: 5 }
      responses:
        "200": { description: OK }
  /api/shops/{shopId}/products:
    get:
      summary: Browse shop products
      parameters:
        - in: path
          name: shopId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /api/cart:
    get:
      summary: Get cart
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/cart/items:
    post:
      summary: Add cart item
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "409": { description: Cross-vendor conflict }
  /api/cart/items/{itemId}:
    patch:
      summary: Update quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
    delete:
      summary: Remove item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /api/orders:
    get:
      summary: List my orders
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
    post:
      summary: Place order from cart
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
        "400": { description: Empty cart }
        "409": { description: Unavailable product }
  /api/admin/vendors:
    get:
      summary: List vendors
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /api/admin/vendors/{id}/approve:
    patch:
      summary: Approve vendor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /api/admin/vendors/{id}/reject:
    patch:
      summary: Reject pending vendor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /api/admin/vendors/{id}/disable:
    patch:
      summary: Disable approved vendor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /api/admin/orders:
    get:
      summary: List all orders
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
